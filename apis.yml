apis:
- aid: cartesia-ai:cartesia-ai-tts-websocket-api
  name: Cartesia TTS WebSocket API
  tags:
  - WebSocket
  - Text-to-Speech
  - Real-Time
  - Streaming
  tags_raw:
  - WebSocket
  - Text to Speech
  - Realtime
  - Streaming
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.cartesia.ai/api-reference/tts/websocket
  baseURL: wss://api.cartesia.ai
  properties:
  - url: https://docs.cartesia.ai/api-reference/tts/websocket
    type: Documentation
  - url: asyncapi/cartesia-ai-asyncapi.yml
    type: AsyncAPI
  description: >-
    Bidirectional, multiplexed WebSocket at wss://api.cartesia.ai/tts/websocket for realtime speech generation.
    Clients send JSON generation requests keyed by a context_id (continuing a context preserves prosody
    across chunks of transcript) and receive base64-encoded audio chunks, optional word and phoneme timestamps,
    flush acknowledgements, and a final done message. A single connection scales to dozens of concurrent
    generation contexts.
- aid: cartesia-ai:cartesia-ai-stt-websocket-api
  name: Cartesia STT WebSocket API
  tags:
  - WebSocket
  - Speech-to-Text
  - Real-Time
  - Turn Detection
  tags_raw:
  - WebSocket
  - Speech to Text
  - Realtime
  - Turn Detection
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.cartesia.ai/api-reference/stt/websocket
  baseURL: wss://api.cartesia.ai
  properties:
  - url: https://docs.cartesia.ai/api-reference/stt/turns/websocket
    type: Documentation
  - url: https://docs.cartesia.ai/api-reference/stt/websocket
    type: APIReference
  - url: asyncapi/cartesia-ai-asyncapi.yml
    type: AsyncAPI
  description: >-
    Realtime transcription over WebSocket at wss://api.cartesia.ai/stt/websocket. Clients stream raw binary
    audio in 100ms chunks and issue finalize/close text commands; the server returns incremental and final
    transcript messages with word-level timing. A companion "Auto" variant at /stt/turns/websocket adds
    built-in turn detection for conversational agents.
