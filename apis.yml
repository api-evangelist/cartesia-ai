aid: cartesia-ai
url: https://raw.githubusercontent.com/api-evangelist/cartesia-ai/refs/heads/main/apis.yml
name: Cartesia
kind: company
description: Cartesia builds real-time voice AI - the Sonic family of text-to-speech models, Ink speech-to-text
  models, and a Voice Agents platform for building and deploying telephone and web voice agents. The core
  generation surface is exposed both as REST (bytes and Server-Sent Events) and as a low-latency, bidirectional
  WebSocket protocol at wss://api.cartesia.ai for streaming TTS and STT with multiplexed contexts, word/phoneme
  timestamps, and mid-stream flush and cancel.
